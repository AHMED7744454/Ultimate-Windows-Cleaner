name: Compile BAT to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ps2exe
      shell: powershell
      run: |
        Install-Module -Name ps2exe -Force -SkipPublisherCheck

    - name: Compile Script
      shell: powershell
      run: |
        # سيقوم بالبحث عن ملف الـ bat في المجلد وتحويله مع إجبار صلاحيات المسؤول
        ps2exe -inputFile "ULTIMATE CLEANER/SuperCleaner.bat" -outputFile "SuperCleaner.exe" -requireAdmin

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: SuperCleaner-EXE
        path: SuperCleaner.exe
