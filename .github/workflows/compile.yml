name: Compile BAT to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ps2exe
      shell: powershell
      run: |
        Install-Module -Name ps2exe -Force -SkipPublisherCheck

    - name: Compile Script
      shell: powershell
      run: |
        # كود ذكي يبحث عن ملف الـ bat تلقائياً ويقوم بتحويله بصلاحية المسؤول
        $batFile = (Get-ChildItem -Recurse -Filter *.bat | Select-Object -First 1).FullName
        if ($batFile) {
            Write-Host "Found batch file at: $batFile"
            ps2exe -inputFile "$batFile" -outputFile "SuperCleaner.exe" -requireAdmin
        } else {
            Write-Error "No .bat file found in the entire repository!"
            exit 1
        }

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: Super Cleaner-EXE
        path: Super Cleaner.exe
